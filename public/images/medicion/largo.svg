  <path d="M385 162 L405 182 M405 162 L385 182" stroke="#FF1493" stroke-width="3" stroke-linecap="round"/>
  <text x="415" y="176" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="800" fill="#FF1493">no ceja</text>

  <text x="328" y="78" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#0f172a">línea del cabello</text>
  <text x="328" y="384" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#0f172a">mentón</text>

  <rect x="100" y="410" width="440" height="36" rx="18" fill="#ffffff" stroke="#00B4B0" stroke-width="2"/>
  <text x="320" y="434" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#0f172a">Cabeza derecha · mirada al frente</text>
