  <circle cx="262" cy="204" r="6.2" fill="url(#iris)"/>
  <circle cx="262" cy="204" r="2.6" fill="#0a0604"/>
  <circle cx="264" cy="202" r="1.5" fill="#fff" opacity="0.85"/>
  <circle cx="358" cy="204" r="6.2" fill="url(#iris)"/>
  <circle cx="358" cy="204" r="2.6" fill="#0a0604"/>
  <circle cx="360" cy="202" r="1.5" fill="#fff" opacity="0.85"/>
