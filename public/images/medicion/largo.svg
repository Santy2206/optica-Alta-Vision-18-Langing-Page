  <path d="M188 220 C175 210 168 230 172 255 C176 278 188 288 200 282 C195 260 192 238 188 220 Z" fill="url(#skin)"/>
  <path d="M432 220 C445 210 452 230 448 255 C444 278 432 288 420 282 C425 260 428 238 432 220 Z" fill="url(#skin)"/>

