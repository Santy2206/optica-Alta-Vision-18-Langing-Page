  <circle cx="310" cy="72" r="11" fill="#39FF14" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="310" cy="378" r="11" fill="#39FF14" stroke="#0f172a" stroke-width="2.5"/>
