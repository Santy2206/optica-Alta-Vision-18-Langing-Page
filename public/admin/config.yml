# Decap CMS — Óptica Alta Visión
# Auth vía DecapBridge (PKCE) — reemplaza Netlify Identity + Git Gateway (deprecado para sitios nuevos).

backend:
  name: git-gateway
  repo: Santy2206/optica-Alta-Vision-18-Langing-Page
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/2a95a454-b62d-4ba8-bbff-84db19349046/pkce
  auth_token_endpoint: /sites/2a95a454-b62d-4ba8-bbff-84db19349046/token
  gateway_url: https://gateway.decapbridge.com

  # Quién hizo cada cambio
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://optica-alta-vision-18.netlify.app

media_folder: public/uploads
public_folder: /uploads

locale: es

collections:
  # --- Carrusel de banners promocionales (inicio del sitio) ---
  - name: carrusel
    label: Carrusel de inicio
    label_singular: Banner
    folder: src/content/carrusel
    create: true
    delete: true
    extension: json
    format: json
    slug: "banner-{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    fields:
      - label: Imagen
        name: image
        widget: image
        media_folder: /public/uploads/carrusel
        public_folder: /uploads/carrusel
        hint: "Banner horizontal (recomendado ~1600x600px). El texto de la promo debe ir dentro de la imagen."
      - { label: Texto alternativo de imagen, name: imageAlt, widget: string }
      - label: Enlace (opcional)
        name: link
        widget: string
        required: false
        hint: "Si se deja vacío, el banner abre WhatsApp al hacer clic."
      - { label: Activo, name: active, widget: boolean, default: true }
      - label: Orden
        name: order
        widget: number
        default: 0
        hint: "Menor número = aparece primero"

  # --- Catálogo de monturas (una entrada JSON por producto) ---
  - name: catalogo
    label: Catálogo
    label_singular: Montura
    folder: src/content/catalogo
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: name
    fields:
      - { label: Nombre, name: name, widget: string }
      - { label: Marca, name: brand, widget: string }
      - label: Categoría
        name: category
        widget: select
        options:
          - { label: Formuladas, value: formuladas }
          - { label: Sol, value: sol }
          - { label: Niños, value: ninos }
          - { label: Deportivas, value: deportivas }
          - { label: Lentes de contacto, value: contacto }
      - label: Precio (COP)
        name: price
        widget: number
        required: false
        value_type: int
        hint: Dejar vacío = "Consultar precio" (WhatsApp)
      - label: Imagen
        name: image
        widget: image
        media_folder: /public/uploads/catalogo
        public_folder: /uploads/catalogo
      - { label: Texto alternativo de imagen, name: imageAlt, widget: string }
      - label: Mostrar en "Más vendidas" (inicio)
        name: featured
        widget: boolean
        default: false
        hint: "Activa esto para que la montura aparezca en el carrusel de la página de inicio."
      - label: Colores disponibles
        name: colors
        widget: list
        required: false
        default: []
        hint: "Opcional. Cada color se muestra como un círculo debajo del nombre. Si le pones foto, al hacer clic cambia la imagen de la tarjeta."
        fields:
          - { label: Nombre del color, name: name, widget: string, hint: "Ej. Negro, Dorado, Carey" }
          - { label: Color (swatch), name: hex, widget: color }
          - label: Foto de este color (opcional)
            name: image
            widget: image
            required: false
            media_folder: /public/uploads/catalogo
            public_folder: /uploads/catalogo
          - label: Foto con modelo puesto (opcional)
            name: modelImage
            widget: image
            required: false
            media_folder: /public/uploads/catalogo
            public_folder: /uploads/catalogo
            hint: "Foto de una persona usando esta montura en este color. Se muestra al pasar el mouse sobre la foto."

  # --- Promociones activables ---
  - name: promociones
    label: Promociones
    label_singular: Promoción
    folder: src/content/promociones
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Descripción, name: description, widget: text }
      - label: Imagen
        name: image
        widget: image
        required: false
        media_folder: /public/uploads/promociones
        public_folder: /uploads/promociones
      - { label: Activa, name: active, widget: boolean, default: false }
      - { label: Texto del CTA, name: ctaText, widget: string, default: "Aprovecha esta promo" }

  # --- Configuración del sitio (archivo único, no carpeta) ---
  - name: configuracion
    label: Configuración
    files:
      - name: site
        label: Datos del sitio
        file: src/content/configuracion/site.json
        fields:
          - { label: Teléfono (wa.me, sin +), name: telefono, widget: string, hint: "Ej. 573118812747" }
          - { label: Horario, name: horario, widget: string }
          - { label: Dirección, name: direccion, widget: string }
          - label: Redes sociales
            name: redesSociales
            widget: object
            fields:
              - { label: Instagram URL, name: instagram, widget: string, required: false }
              - { label: Facebook URL, name: facebook, widget: string, required: false }
          - { label: Google Maps embed URL, name: googleMapsEmbedUrl, widget: string, required: false }
