# Decap CMS — Óptica Alta Visión
# Auth vía DecapBridge (PKCE) — reemplaza Netlify Identity + Git Gateway (deprecado para sitios nuevos).

backend:
  name: git-gateway
  repo: Santy2206/optica-Alta-Vision-18-Langing-Page
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/2a95a454-b62d-4ba8-bbff-84db19349046/pkce
  auth_token_endpoint: /sites/2a95a454-b62d-4ba8-bbff-84db19349046/token
  gateway_url: https://gateway.decapbridge.com

  # Quién hizo cada cambio
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://optica-alta-vision-18.netlify.app

media_folder: public/uploads
public_folder: /uploads

locale: es

collections:
  # --- Carrusel de banners promocionales (inicio del sitio) ---
  - name: carrusel
    label: Carrusel de inicio
    label_singular: Banner
    folder: src/content/carrusel
    create: true
    delete: true
    extension: json
    format: json
    slug: "banner-{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    fields:
      - label: Imagen
        name: image
        widget: image
        media_folder: /public/uploads/carrusel
        public_folder: /uploads/carrusel
        hint: "Banner horizontal (recomendado ~1600x600px). El texto de la promo debe ir dentro de la imagen."
      - { label: Texto alternativo de imagen, name: imageAlt, widget: string }
      - label: Enlace (opcional)
        name: link
        widget: string
        required: false
        hint: "Si se deja vacío, el banner abre WhatsApp al hacer clic."
      - { label: Activo, name: active, widget: boolean, default: true }
      - label: Orden
        name: order
        widget: number
        default: 0
        hint: "Menor número = aparece primero"

  # --- Catálogo de monturas (una entrada JSON por producto) ---
  - name: catalogo
    label: Catálogo
    label_singular: Montura
    folder: src/content/catalogo
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: name
    fields:
      - { label: Nombre, name: name, widget: string }
      - { label: Marca, name: brand, widget: string }
      - label: Categoría
        name: category
        widget: select
        options:
          - { label: Formuladas, value: formuladas }
          - { label: Sol, value: sol }
          - { label: Niños, value: ninos }
          - { label: Deportivas, value: deportivas }
          - { label: Lentes blandos, value: contacto }
      - label: Precio (COP)
        name: price
        widget: number
        required: false
        value_type: int
        hint: "Vacío = se muestra 'Monturas desde $X' (Configuración) o 'Cotiza por WhatsApp'."
      - label: Imagen
        name: image
        widget: image
        media_folder: /public/uploads/catalogo
        public_folder: /uploads/catalogo
        hint: "Sube la foto tal cual la tomaste. El sitio recorta el fondo automáticamente en el siguiente despliegue — no hace falta editarla."
      - { label: Texto alternativo de imagen, name: imageAlt, widget: string }
      - label: Mostrar en "Más vendidas" (inicio)
        name: featured
        widget: boolean
        default: false
        hint: "Activa esto para que la montura aparezca en el carrusel de la página de inicio."
      - label: SKU de prueba virtual (Jeeliz) — opcional, se autocompleta
        name: tryOnSku
        widget: string
        required: false
        hint: "Déjalo vacío: el sitio busca solo un modelo 3D parecido según la marca y el nombre que escribiste arriba. Solo llénalo si quieres forzar un modelo exacto de la base gratuita de Jeeliz."
      - label: Colores del marco
        name: colors
        widget: list
        required: false
        default: []
        hint: "Opcional. Cada color de MARCO se muestra como un círculo debajo del nombre. Los colores de lente van dentro de cada marco."
        fields:
          - { label: Nombre del color del marco, name: name, widget: string, hint: "Ej. Negro, Dorado, Habano" }
          - { label: Color (swatch), name: hex, widget: color }
          - label: Segundo tono (marcos bicolor)
            name: hex2
            widget: color
            required: false
            hint: "Opcional. Si el marco es de dos colores, el círculo se muestra partido."
          - label: Foto de este color (opcional)
            name: image
            widget: image
            required: false
            media_folder: /public/uploads/catalogo
            public_folder: /uploads/catalogo
          - label: Foto con modelo puesto (opcional)
            name: modelImage
            widget: image
            required: false
            media_folder: /public/uploads/catalogo
            public_folder: /uploads/catalogo
            hint: "Foto de una persona usando esta montura en este color. Se muestra al pasar el mouse sobre la foto."
          - label: SKU de prueba virtual por defecto (opcional)
            name: tryOnSku
            widget: string
            required: false
            hint: "SKU que se carga al abrir 'Probar con cámara' con este color de marco."
          - label: Colores de lente
            name: lenses
            widget: list
            required: false
            default: []
            hint: "Opciones de lente para este marco. El cliente las cambia dentro de 'Probar con cámara'."
            fields:
              - { label: Nombre del lente, name: name, widget: string, hint: "Ej. Verde clásico, Azul espejado" }
              - { label: Color (swatch), name: hex, widget: color }
              - { label: SKU de prueba virtual, name: tryOnSku, widget: string }

  # --- Promociones activables ---
  - name: promociones
    label: Promociones
    label_singular: Promoción
    folder: src/content/promociones
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: Título, name: title, widget: string }
      - { label: Descripción, name: description, widget: text }
      - label: Imagen
        name: image
        widget: image
        required: false
        media_folder: /public/uploads/promociones
        public_folder: /uploads/promociones
      - { label: Activa, name: active, widget: boolean, default: false }
      - { label: Texto del CTA, name: ctaText, widget: string, default: "Aprovecha esta promo" }

  # --- Testimonios de clientes (sección "Lo que dicen nuestros clientes") ---
  - name: testimonios
    label: Testimonios
    label_singular: Testimonio
    folder: src/content/testimonios
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{slug}}"
    identifier_field: nombre
    fields:
      - { label: Nombre del cliente, name: nombre, widget: string, hint: "Solo con autorización del cliente. Ej. 'Ana M.'" }
      - { label: Testimonio, name: texto, widget: text }
      - label: Foto (opcional)
        name: foto
        widget: image
        required: false
        media_folder: /public/uploads/testimonios
        public_folder: /uploads/testimonios
      - { label: Estrellas, name: estrellas, widget: number, value_type: int, min: 1, max: 5, default: 5 }
      - { label: Mostrar en la página, name: active, widget: boolean, default: true }
      - { label: Orden, name: order, widget: number, value_type: int, default: 0, hint: "Menor número = aparece primero en el carrusel" }
      - { label: Link a la reseña (Google), name: url, widget: string, required: false, hint: "URL de la reseña o del perfil del autor en Google Maps" }

  # --- Configuración del sitio (archivo único, no carpeta) ---
  - name: configuracion
    label: Configuración
    files:
      - name: site
        label: Datos del sitio
        file: src/content/configuracion/site.json
        fields:
          - { label: Teléfono (wa.me, sin +), name: telefono, widget: string, hint: "Ej. 573118812747" }
          - label: Horario de atención
            name: horario
            widget: object
            hint: "Se usa en la página (hero, ubicación, footer) y en Google. Días consecutivos se muestran como 'Lunes a Sábado'."
            fields:
              - label: Días de atención
                name: dias
                widget: select
                multiple: true
                min: 1
                options:
                  - { label: Lunes, value: Monday }
                  - { label: Martes, value: Tuesday }
                  - { label: Miércoles, value: Wednesday }
                  - { label: Jueves, value: Thursday }
                  - { label: Viernes, value: Friday }
                  - { label: Sábado, value: Saturday }
                  - { label: Domingo, value: Sunday }
              - { label: Hora de apertura, name: abre, widget: datetime, date_format: false, time_format: "HH:mm", format: "HH:mm", picker_utc: false, hint: "Formato 24 h. Ej. 11:00" }
              - { label: Hora de cierre, name: cierra, widget: datetime, date_format: false, time_format: "HH:mm", format: "HH:mm", picker_utc: false, hint: "Formato 24 h. Ej. 20:00" }
          - label: Barrio
            name: barrio
            widget: string
            required: false
            hint: "Ej. Kennedy. Se usa en el título del sitio (SEO) y en el titular principal. Vacío = no se muestra."
          - label: Dirección
            name: direccion
            widget: string
            required: false
            hint: "Dirección exacta del local. Vacío = la fila de dirección se oculta."
          - label: Dirección para Google (SEO)
            name: direccionPostal
            widget: object
            collapsed: true
            hint: "Datos estructurados para buscadores. La calle va sin barrio ni ciudad."
            fields:
              - { label: Calle y número, name: calle, widget: string, required: false, hint: "Ej. Cl. 18 #103A-40" }
              - { label: Ciudad, name: localidad, widget: string, required: false, default: "Bogotá" }
          - label: Coordenadas del local (SEO)
            name: geo
            widget: object
            collapsed: true
            hint: "Latitud y longitud del local en Google Maps (clic derecho sobre el pin → copiar coordenadas)."
            fields:
              - { label: Latitud, name: lat, widget: number, value_type: float, required: false }
              - { label: Longitud, name: lng, widget: number, value_type: float, required: false }
          - label: "Página Nosotros"
            name: nosotros
            widget: object
            collapsed: true
            hint: "Cada bloque de la página /nosotros se oculta si su campo queda vacío. No se inventa contenido: escribe tú la historia."
            fields:
              - label: Historia
                name: historia
                widget: text
                required: false
                hint: "Texto largo. Un párrafo por línea en blanco."
              - label: Cita destacada
                name: cita
                widget: string
                required: false
                hint: "Una frase corta, del optómetra o del negocio. Se muestra resaltada."
              - label: Fotos del local
                name: fotosLocal
                widget: list
                field: { label: Foto, name: image, widget: image, media_folder: /public/uploads/nosotros, public_folder: /uploads/nosotros }
                required: false
                default: []
          - label: Redes sociales
            name: redesSociales
            widget: object
            fields:
              - { label: Instagram URL, name: instagram, widget: string, required: false }
              - { label: Facebook URL, name: facebook, widget: string, required: false }
          - { label: Google Maps embed URL, name: googleMapsEmbedUrl, widget: string, required: false }

          # --- Titular principal (hero) ---
          - label: Titular principal (hero)
            name: hero
            widget: object
            collapsed: true
            fields:
              - label: Título
                name: titulo
                widget: string
                required: false
                default: "Ve mejor en {tiempoEntrega}{barrio}"
                hint: "{tiempoEntrega} se reemplaza por el tiempo de entrega. {barrio} se convierte en ', aquí en <barrio>' o desaparece si el barrio está vacío. El nombre del barrio se resalta en fucsia."
              - label: Subtítulo
                name: subtitulo
                widget: text
                required: false
                default: "Optometría profesional, monturas formuladas y de sol{cuotas}."
                hint: "{cuotas} se convierte en ', con pagos en cuotas' solo si 'Pagos → Acepta cuotas' está activo."
          - label: Foto del local (hero)
            name: heroImagen
            widget: image
            required: false
            media_folder: /public/uploads/hero
            public_folder: /uploads/hero
            hint: "Foto REAL del local, en WebP (~1200x900px). Vacío = el titular se muestra centrado sin imagen."

          # --- Precios y tiempos ---
          - label: Examen visual
            name: examen
            widget: object
            collapsed: true
            fields:
              - label: Precio del examen (COP)
                name: precio
                widget: number
                value_type: int
                required: false
                hint: "Vacío = no se muestra precio."
              - label: Gratis si compra las gafas
                name: gratisConCompra
                widget: boolean
                default: false
          - label: Pagos
            name: pagos
            widget: object
            collapsed: true
            fields:
              - label: Acepta pagos a cuotas
                name: cuotas
                widget: boolean
                default: false
                hint: "Activar SOLO si está confirmado. Controla el texto del titular y la respuesta de la FAQ de pagos."
              - label: Acepta ADDI
                name: addi
                widget: boolean
                default: false
                hint: "Financiación ADDI. Se muestra en hero y FAQ."
              - label: Acepta Sistecredito
                name: sistecredito
                widget: boolean
                default: false
                hint: "Financiación Sistecredito. Se muestra en hero y FAQ."
          - label: Probador virtual
            name: probador
            widget: object
            collapsed: true
            fields:
              - label: Texto del botón después de probarse
                name: ctaTexto
                widget: string
                required: false
                default: "Me gustan, ¿las tienen disponibles?"
                hint: "Aparece cuando el cliente ya se vio con las gafas puestas. Abre WhatsApp con la montura, el color y el lente."
          - label: Preguntas frecuentes
            name: faq
            widget: object
            collapsed: true
            hint: "Respuestas que dependen de la política del negocio. Si un campo queda vacío, esa pregunta NO se muestra."
            fields:
              - label: "¿Qué pasa si mi fórmula no me queda bien?"
                name: garantiaFormula
                widget: text
                required: false
                hint: "Ej. política de ajuste o cambio de lentes. Frases cortas, en segunda persona."
              - label: "¿Atienden niños?"
                name: ninos
                widget: text
                required: false
                hint: "Ej. desde qué edad se hace el examen. Frases cortas, en segunda persona."
          - label: Precio desde (monturas, COP)
            name: precioDesdeMontura
            widget: number
            value_type: int
            required: false
            hint: "Se muestra como 'Monturas desde $X' en productos sin precio. Vacío = 'Cotiza por WhatsApp'."
          - label: Tiempo de entrega
            name: tiempoEntrega
            widget: string
            required: false
            default: "3 a 5 días hábiles"

          # --- Confianza ---
          - label: Años de experiencia
            name: aniosExperiencia
            widget: number
            value_type: int
            required: false
            hint: "Vacío = no se muestra."
          - label: Clientes atendidos
            name: clientesAtendidos
            widget: number
            value_type: int
            required: false
            hint: "Vacío = no se muestra."
          - label: Reseñas de Google
            name: googleReviews
            widget: object
            collapsed: true
            fields:
              - label: Calificación (ej. 4.8)
                name: rating
                widget: number
                value_type: float
                min: 0
                max: 5
                step: 0.1
                required: false
                hint: "Copiar la calificación real del perfil de Google. Vacío = no se muestran reseñas."
              - label: Total de reseñas
                name: total
                widget: number
                value_type: int
                required: false
              - label: Enlace al perfil de Google
                name: url
                widget: string
                required: false
          - label: Optómetra
            name: optometra
            widget: object
            collapsed: true
            hint: "Vacío = se ocultan los bloques que presentan al optómetra."
            fields:
              - { label: Nombre, name: nombre, widget: string, required: false }
              - { label: Cargo, name: cargo, widget: string, required: false, hint: "Ej. Optómetra" }
              - { label: Tarjeta profesional, name: tarjetaProfesional, widget: string, required: false }
              - label: Foto
                name: foto
                widget: image
                required: false
                media_folder: /public/uploads/equipo
                public_folder: /uploads/equipo
